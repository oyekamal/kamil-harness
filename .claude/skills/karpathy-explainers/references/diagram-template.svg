<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Rung-2 template. Copy, rename the nodes, keep the conventions (diagram_check.py enforces them):
       every box = <g class="node" id=...> with a <text> label using the REAL name;
       every arrow = <g class="edge" data-step="N" data-from=.. data-to=..> with the number drawn in a circle
       and a short label saying WHAT moves; anything not verified = class "uncertain" + data-why + dashed stroke.
       Colour = meaning (same colour for the same quantity in every rung). Text >= 13px. -->
  <title>TODO: one-line title that says what the diagram shows</title>
  <desc>TODO: the alt text. Step 1 ..., step 2 ...</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>

  <g class="node" id="a">
    <rect x="20" y="110" width="180" height="80" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="110" y="156" font-size="18" text-anchor="middle">Source A</text></g>
  <g class="node" id="b">
    <rect x="290" y="110" width="180" height="80" rx="10" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
    <text x="380" y="156" font-size="18" text-anchor="middle">Middle B</text></g>
  <g class="node uncertain" id="c" data-why="TODO: why this box is not verified">
    <rect x="560" y="110" width="180" height="80" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="650" y="150" font-size="18" text-anchor="middle">Target C</text>
    <text x="650" y="174" font-size="13" text-anchor="middle" fill="#c53030">unverified</text></g>

  <g class="edge" data-step="1" data-from="a" data-to="b">
    <path d="M200,150 L288,150" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="244" cy="126" r="13" fill="#fff" stroke="#333"/>
    <text x="244" y="131" font-size="14" text-anchor="middle" font-weight="bold">1</text>
    <text x="244" y="182" font-size="13" text-anchor="middle">what moves</text></g>
  <g class="edge" data-step="2" data-from="b" data-to="c">
    <path d="M470,150 L558,150" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="514" cy="126" r="13" fill="#fff" stroke="#333"/>
    <text x="514" y="131" font-size="14" text-anchor="middle" font-weight="bold">2</text>
    <text x="514" y="182" font-size="13" text-anchor="middle">what moves</text></g>

  <g class="legend"><text x="20" y="250" font-size="13" fill="#555">Numbers = order of events. Dashed = not verified against the source.</text>
    <text x="20" y="272" font-size="13" fill="#555">Source: TODO book, page N.</text></g>
  <!-- Weak spots drawn INTO the image, so the PNG carries its limits when seen alone. Keep 3 real ones. -->
  <g class="weak">
    <rect x="14" y="292" width="932" height="112" rx="8" fill="#fff8e6" stroke="#c9a227" stroke-dasharray="5 4"/>
    <text x="28" y="316" font-size="13" font-weight="bold" fill="#5a4500">Weak spots in this diagram</text>
    <text x="28" y="340" font-size="13" fill="#5a4500">1. TODO label/arrow: why it may be wrong or simplified, and how to check it.</text>
    <text x="28" y="362" font-size="13" fill="#5a4500">2. TODO</text>
    <text x="28" y="384" font-size="13" fill="#5a4500">3. TODO</text></g>
</svg>
